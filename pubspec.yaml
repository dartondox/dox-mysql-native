name: dox_mysql_native
description: Fast native MySQL and MariaDB client for Dart, the default MySQL driver of the Dox ORM. Rust (mysql_async) runs the pool and a prepared statement cache. Dart gets typed rows.
version: 3.0.0
repository: https://github.com/dartondox/dox-mysql-native
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0

dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.7
  hooks: ^2.2.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
